<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3ff"/>
      <stop offset="1" stop-color="#fdf3e1"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#e3a91c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="130" cy="90" rx="60" ry="22"/>
    <ellipse cx="170" cy="78" rx="42" ry="20"/>
    <ellipse cx="640" cy="70" rx="70" ry="24"/>
    <ellipse cx="690" cy="58" rx="40" ry="18"/>
  </g>

  <!-- ground -->
  <path d="M0 430 Q200 405 400 425 T800 420 V500 H0 Z" fill="#9fd48b"/>
  <path d="M0 455 Q220 440 420 455 T800 450 V500 H0 Z" fill="#86c172"/>

  <!-- the contract stays standing -->
  <g transform="translate(560 270)">
    <rect x="0" y="40" width="150" height="125" rx="8" fill="#f4f1ff" stroke="#5b4fa8" stroke-width="5"/>
    <path d="M-12 46 L75 -12 L162 46 Z" fill="#7d6fd6" stroke="#5b4fa8" stroke-width="5" stroke-linejoin="round"/>
    <rect x="58" y="105" width="34" height="60" rx="4" fill="#5b4fa8"/>
    <rect x="18" y="70" width="30" height="26" rx="3" fill="#cfe8ff" stroke="#5b4fa8" stroke-width="3"/>
    <rect x="102" y="70" width="30" height="26" rx="3" fill="#cfe8ff" stroke="#5b4fa8" stroke-width="3"/>
    <text x="75" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">0xFF</text>
    <!-- sign -->
    <rect x="-70" y="120" width="62" height="30" rx="4" fill="#fffbe8" stroke="#a07a2c" stroke-width="3"/>
    <rect x="-42" y="150" width="6" height="18" fill="#a07a2c"/>
    <text x="-39" y="141" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#6b4f16">still here</text>
  </g>

  <!-- coin trail from the contract -->
  <g fill="url(#coin)" stroke="#b8860b" stroke-width="2">
    <circle cx="520" cy="300" r="9"/>
    <circle cx="488" cy="272" r="8"/>
  </g>

  <!-- flying capybara -->
  <g transform="translate(250 175)">
    <!-- back wing -->
    <path d="M70 20 C40 -60 140 -80 150 -10 C130 -30 110 -25 100 10 Z" fill="#ffffff" stroke="#9aa9c4" stroke-width="3"/>
    <!-- body -->
    <ellipse cx="90" cy="60" rx="95" ry="58" fill="#b07a4a"/>
    <ellipse cx="80" cy="72" rx="70" ry="36" fill="#c99366"/>
    <!-- head -->
    <path d="M150 20 C205 10 245 35 245 70 C245 100 215 112 180 108 C160 106 145 92 140 70 Z" fill="#a8703f"/>
    <ellipse cx="236" cy="74" rx="14" ry="18" fill="#8a5a31"/>
    <circle cx="242" cy="68" r="3" fill="#3b2410"/>
    <circle cx="193" cy="52" r="7" fill="#2b1a0b"/>
    <circle cx="195" cy="50" r="2.2" fill="#ffffff"/>
    <ellipse cx="168" cy="22" rx="10" ry="7" fill="#8a5a31"/>
    <path d="M222 92 Q230 98 238 92" stroke="#3b2410" stroke-width="3" fill="none" stroke-linecap="round"/>
    <ellipse cx="208" cy="80" rx="9" ry="5" fill="#f2a7a0" opacity="0.7"/>
    <!-- legs -->
    <rect x="35" y="100" width="18" height="26" rx="8" fill="#8a5a31"/>
    <rect x="125" y="100" width="18" height="26" rx="8" fill="#8a5a31"/>
    <!-- front wing -->
    <path d="M60 40 C20 -40 120 -70 135 0 C115 -15 95 -10 85 35 Z" fill="#ffffff" stroke="#9aa9c4" stroke-width="3"/>
    <!-- coin bag held in the front paw -->
    <g transform="translate(150 118)">
      <path d="M-4 0 L34 0 L28 12 L2 12 Z" fill="#7a5a2e"/>
      <path d="M-10 10 C-30 60 60 60 44 10 Z" fill="#d9b25a" stroke="#8a6a2a" stroke-width="3"/>
      <text x="17" y="44" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#5b4012">Ξ</text>
    </g>
    <rect x="152" y="96" width="14" height="28" rx="7" fill="#8a5a31"/>
  </g>

  <!-- caption -->
  <text x="400" y="480" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#2f4a2a">SENDALL: take the balance, leave the contract</text>
</svg>
