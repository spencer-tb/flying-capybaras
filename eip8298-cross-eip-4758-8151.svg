<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8e0ff"/>
      <stop offset="1" stop-color="#eef8ff"/>
    </linearGradient>
    <radialGradient id="fur" cx="0.45" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#b07a45"/>
      <stop offset="1" stop-color="#8a5a2e"/>
    </radialGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3ecf5"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#f3e3c3"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d365"/>
      <stop offset="1" stop-color="#c99a1e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="690" cy="90" r="44" fill="#ffd36e"/>
  <circle cx="690" cy="90" r="66" fill="#ffd36e" opacity="0.25"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.95">
    <circle cx="120" cy="90" r="22"/><circle cx="148" cy="78" r="28"/>
    <circle cx="178" cy="92" r="20"/><rect x="102" y="90" width="96" height="22" rx="11"/>
    <circle cx="560" cy="430" r="26"/><circle cx="596" cy="418" r="32"/>
    <circle cx="634" cy="432" r="24"/><rect x="534" y="430" width="126" height="26" rx="13"/>
    <circle cx="120" cy="440" r="24"/><circle cx="152" cy="428" r="30"/>
    <circle cx="186" cy="442" r="22"/><rect x="96" y="440" width="114" height="24" rx="12"/>
  </g>

  <!-- retired key on the left cloud: ecrecover withheld (EIP-8151) -->
  <g transform="translate(108 360)">
    <circle cx="22" cy="22" r="20" fill="none" stroke="url(#brass)" stroke-width="10"/>
    <rect x="40" y="17" width="70" height="10" rx="4" fill="#d9a441"/>
    <rect x="92" y="27" width="8" height="16" fill="#d9a441"/>
    <rect x="76" y="27" width="8" height="12" fill="#d9a441"/>
    <line x1="-6" y1="-6" x2="114" y2="54" stroke="#e5484d" stroke-width="9" stroke-linecap="round"/>
    <line x1="114" y1="-6" x2="-6" y2="54" stroke="#e5484d" stroke-width="9" stroke-linecap="round"/>
    <text x="54" y="-18" text-anchor="middle" font-family="Menlo, monospace" font-size="15" font-weight="700" fill="#7a2a2c">ecrecover: withheld</text>
  </g>

  <!-- SELFDESTRUCT button on the right cloud, swept not destroyed (EIP-4758) -->
  <g transform="translate(548 330)">
    <rect x="0" y="40" width="110" height="46" rx="10" fill="#5b6770"/>
    <ellipse cx="55" cy="40" rx="44" ry="16" fill="#e5484d"/>
    <ellipse cx="55" cy="34" rx="44" ry="16" fill="#ff6b6f"/>
    <text x="55" y="70" text-anchor="middle" font-family="Menlo, monospace" font-size="11" font-weight="700" fill="#ffffff">SELFDESTRUCT</text>
    <text x="55" y="-6" text-anchor="middle" font-family="Menlo, monospace" font-size="15" font-weight="700" fill="#2c5d7c">= SENDALL</text>
    <g fill="#f2c94c" stroke="#c99a1e" stroke-width="2">
      <ellipse cx="132" cy="62" rx="14" ry="5"/><ellipse cx="146" cy="54" rx="14" ry="5"/>
    </g>
  </g>

  <!-- flying capybara -->
  <g transform="translate(300 150)">
    <!-- wings -->
    <path d="M70 40 C 20 -40, -50 -20, -40 30 C 0 20, 30 30, 70 50 Z" fill="url(#wing)" stroke="#b9c7d6" stroke-width="3"/>
    <path d="M150 40 C 200 -40, 270 -20, 260 30 C 220 20, 190 30, 150 50 Z" fill="url(#wing)" stroke="#b9c7d6" stroke-width="3"/>
    <!-- body -->
    <ellipse cx="110" cy="80" rx="95" ry="58" fill="url(#fur)"/>
    <!-- head -->
    <ellipse cx="205" cy="62" rx="48" ry="40" fill="url(#fur)"/>
    <rect x="222" y="48" width="34" height="34" rx="14" fill="#7a4f28"/>
    <circle cx="198" cy="48" r="6" fill="#2b1a0e"/>
    <circle cx="200" cy="46" r="2" fill="#ffffff"/>
    <ellipse cx="176" cy="30" rx="9" ry="7" fill="#7a4f28"/>
    <circle cx="246" cy="60" r="3" fill="#2b1a0e"/>
    <path d="M232 76 q 8 6 16 0" stroke="#2b1a0e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- legs -->
    <rect x="50" y="122" width="18" height="26" rx="8" fill="#7a4f28"/>
    <rect x="150" y="122" width="18" height="26" rx="8" fill="#7a4f28"/>
    <!-- adopted code scroll -->
    <g transform="translate(60 150)">
      <rect x="0" y="0" width="150" height="74" rx="8" fill="url(#paper)" stroke="#c9a96b" stroke-width="3"/>
      <circle cx="0" cy="37" r="10" fill="#e8d3a6" stroke="#c9a96b" stroke-width="3"/>
      <circle cx="150" cy="37" r="10" fill="#e8d3a6" stroke="#c9a96b" stroke-width="3"/>
      <text x="75" y="30" text-anchor="middle" font-family="Menlo, monospace" font-size="15" font-weight="700" fill="#4a3412">SETCODEFROM</text>
      <text x="75" y="54" text-anchor="middle" font-family="Menlo, monospace" font-size="12" fill="#6b4c1e">adopted code</text>
    </g>
    <line x1="88" y1="138" x2="96" y2="152" stroke="#7a4f28" stroke-width="5" stroke-linecap="round"/>
    <line x1="178" y1="138" x2="172" y2="152" stroke="#7a4f28" stroke-width="5" stroke-linecap="round"/>
  </g>

  <text x="400" y="40" text-anchor="middle" font-family="Menlo, monospace" font-size="20" font-weight="700" fill="#2c5d7c">EIP-8298 meets EIP-4758 and EIP-8151</text>
</svg>
