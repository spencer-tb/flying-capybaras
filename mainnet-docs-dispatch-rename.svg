<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb37a"/>
      <stop offset="0.55" stop-color="#ffd9a8"/>
      <stop offset="1" stop-color="#fff1d6"/>
    </linearGradient>
    <radialGradient id="fur" cx="0.45" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#b07a45"/>
      <stop offset="1" stop-color="#8a5a2e"/>
    </radialGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fbf6a"/>
      <stop offset="1" stop-color="#4f9a4a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="110" cy="95" r="50" fill="#fff0a8"/>
  <circle cx="110" cy="95" r="70" fill="#fff0a8" opacity="0.3"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.92">
    <circle cx="300" cy="70" r="22"/><circle cx="328" cy="58" r="28"/>
    <circle cx="358" cy="72" r="21"/><rect x="284" y="72" width="92" height="20" rx="10"/>
    <circle cx="640" cy="110" r="24"/><circle cx="670" cy="98" r="30"/>
    <circle cx="702" cy="112" r="22"/><rect x="622" y="112" width="98" height="22" rx="11"/>
  </g>

  <!-- hills -->
  <path d="M0 420 Q150 350 320 410 T640 395 T800 415 V500 H0 Z" fill="url(#hill)"/>
  <path d="M0 455 Q200 415 420 450 T800 445 V500 H0 Z" fill="#3f8a3f"/>

  <!-- old signpost, leaning -->
  <g transform="translate(150 405) rotate(-12)">
    <rect x="-5" y="-110" width="10" height="120" fill="#7a5a3a"/>
    <rect x="-88" y="-128" width="176" height="40" rx="6" fill="#c9b79a" stroke="#7a5a3a" stroke-width="3"/>
    <text x="0" y="-102" font-family="Menlo, monospace" font-size="17" fill="#6b5a45" text-anchor="middle">steel-website</text>
    <line x1="-76" y1="-108" x2="76" y2="-108" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- new signpost -->
  <g transform="translate(640 430)">
    <rect x="-6" y="-150" width="12" height="160" fill="#6b4a2a"/>
    <path d="M-135 -172 H120 L146 -150 L120 -128 H-135 Z" fill="#fffdf5" stroke="#6b4a2a" stroke-width="3"/>
    <text x="-4" y="-144" font-family="Menlo, monospace" font-size="17" font-weight="bold" fill="#2f5d8a" text-anchor="middle">protocol-specs-website</text>
  </g>

  <!-- speed lines -->
  <g stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.85">
    <line x1="60" y1="185" x2="150" y2="185"/>
    <line x1="35" y1="215" x2="135" y2="215"/>
    <line x1="70" y1="245" x2="140" y2="245"/>
  </g>

  <!-- capybara -->
  <g transform="translate(350 205) rotate(-8)">
    <!-- cape -->
    <path d="M-70 -30 Q-170 -45 -190 20 Q-150 5 -135 30 Q-110 0 -60 10 Z" fill="#d94b4b"/>
    <path d="M-70 -30 Q-120 -30 -150 0" fill="none" stroke="#b83838" stroke-width="3"/>
    <!-- back legs -->
    <ellipse cx="-95" cy="38" rx="34" ry="13" fill="#7a4e27" transform="rotate(12 -95 38)"/>
    <!-- body -->
    <ellipse cx="0" cy="0" rx="112" ry="56" fill="url(#fur)"/>
    <!-- front legs holding parcel -->
    <ellipse cx="70" cy="46" rx="30" ry="11" fill="#7a4e27" transform="rotate(25 70 46)"/>
    <ellipse cx="38" cy="50" rx="28" ry="11" fill="#7a4e27" transform="rotate(35 38 50)"/>
    <!-- head -->
    <ellipse cx="108" cy="-22" rx="56" ry="42" fill="url(#fur)"/>
    <rect x="128" y="-34" width="48" height="40" rx="18" fill="#9a6838"/>
    <ellipse cx="170" cy="-18" rx="5" ry="4" fill="#3d2814"/>
    <path d="M150 -2 Q162 6 174 -2" fill="none" stroke="#3d2814" stroke-width="3" stroke-linecap="round"/>
    <!-- ears -->
    <ellipse cx="78" cy="-58" rx="11" ry="9" fill="#7a4e27"/>
    <ellipse cx="104" cy="-62" rx="11" ry="9" fill="#7a4e27"/>
    <!-- eye -->
    <circle cx="122" cy="-34" r="6" fill="#2a1a0c"/>
    <circle cx="124" cy="-36" r="2" fill="#ffffff"/>
    <!-- goggles strap -->
    <path d="M62 -44 Q100 -70 140 -44" fill="none" stroke="#2f5d8a" stroke-width="5"/>

    <!-- docs parcel -->
    <g transform="translate(58 88) rotate(6)">
      <line x1="-6" y1="-34" x2="0" y2="-18" stroke="#6b4a2a" stroke-width="3"/>
      <line x1="26" y1="-30" x2="20" y2="-18" stroke="#6b4a2a" stroke-width="3"/>
      <rect x="-34" y="-18" width="90" height="62" rx="6" fill="#fffdf5" stroke="#2f5d8a" stroke-width="3"/>
      <text x="11" y="6" font-family="Menlo, monospace" font-size="15" font-weight="bold" fill="#2f5d8a" text-anchor="middle">mainnet</text>
      <line x1="-22" y1="16" x2="44" y2="16" stroke="#9db7d0" stroke-width="3" stroke-linecap="round"/>
      <line x1="-22" y1="26" x2="44" y2="26" stroke="#9db7d0" stroke-width="3" stroke-linecap="round"/>
      <line x1="-22" y1="36" x2="20" y2="36" stroke="#9db7d0" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- dotted flight path to the new sign -->
  <path d="M540 175 Q610 160 640 240" fill="none" stroke="#2f5d8a" stroke-width="4" stroke-dasharray="2 12" stroke-linecap="round"/>
</svg>
