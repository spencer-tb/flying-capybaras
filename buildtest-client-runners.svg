<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3ff"/>
      <stop offset="1" stop-color="#e6f6ff"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b07a4a"/>
      <stop offset="1" stop-color="#8a5a33"/>
    </linearGradient>
  </defs>

  <!-- sky and clouds -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="110" cy="80" rx="60" ry="22"/>
    <ellipse cx="150" cy="70" rx="40" ry="20"/>
    <ellipse cx="470" cy="62" rx="62" ry="20"/>
    <ellipse cx="510" cy="54" rx="40" ry="16"/>
  </g>

  <!-- the fixture's blueprint, floating -->
  <g transform="translate(598 34) rotate(6)">
    <rect x="0" y="0" width="170" height="120" rx="6" fill="#2f6fb5" stroke="#1d4a7c" stroke-width="3"/>
    <g stroke="#cfe6ff" stroke-width="1" opacity="0.6">
      <line x1="0" y1="30" x2="170" y2="30"/><line x1="0" y1="60" x2="170" y2="60"/><line x1="0" y1="90" x2="170" y2="90"/>
      <line x1="42" y1="0" x2="42" y2="120"/><line x1="85" y1="0" x2="85" y2="120"/><line x1="128" y1="0" x2="128" y2="120"/>
    </g>
    <text x="85" y="26" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">fixture payload</text>
    <rect x="45" y="44" width="80" height="54" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="6 4"/>
    <text x="85" y="76" font-family="Courier New, monospace" font-size="13" fill="#ffffff" text-anchor="middle">blockHash</text>
  </g>

  <!-- dotted flight path -->
  <path d="M120 300 C 220 250, 300 230, 390 215" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="2 12" stroke-linecap="round"/>

  <!-- the flying capybara -->
  <g transform="translate(360 150)">
    <!-- back wing -->
    <path d="M70 40 C 40 -30, 130 -40, 140 30 Z" fill="#f4f8ff" stroke="#9fb3c8" stroke-width="3"/>
    <!-- body -->
    <ellipse cx="100" cy="85" rx="95" ry="55" fill="url(#fur)"/>
    <!-- legs tucked -->
    <ellipse cx="55" cy="132" rx="16" ry="10" fill="#7a4d2b"/>
    <ellipse cx="140" cy="134" rx="16" ry="10" fill="#7a4d2b"/>
    <!-- head -->
    <path d="M165 50 C 215 40, 250 70, 245 100 C 240 125, 200 128, 170 118 Z" fill="url(#fur)"/>
    <ellipse cx="236" cy="96" rx="14" ry="12" fill="#6b4226"/>
    <ellipse cx="240" cy="92" rx="4" ry="3" fill="#2b1a10"/>
    <circle cx="206" cy="74" r="6" fill="#2b1a10"/>
    <circle cx="208" cy="72" r="2" fill="#ffffff"/>
    <ellipse cx="184" cy="52" rx="10" ry="7" fill="#6b4226"/>
    <path d="M218 108 Q 228 114 236 108" fill="none" stroke="#2b1a10" stroke-width="2" stroke-linecap="round"/>
    <!-- hard hat -->
    <path d="M168 50 C 172 18, 232 14, 238 46 Z" fill="#ffcc1a" stroke="#c99a00" stroke-width="3"/>
    <rect x="160" y="44" width="86" height="9" rx="4" fill="#ffcc1a" stroke="#c99a00" stroke-width="3"/>
    <!-- front wing -->
    <path d="M90 60 C 60 -20, 175 -25, 170 55 Z" fill="#ffffff" stroke="#9fb3c8" stroke-width="3"/>
    <path d="M110 30 Q 130 18 150 28 M108 45 Q 132 34 158 44" fill="none" stroke="#c9d6e3" stroke-width="3" stroke-linecap="round"/>
    <!-- the block it built, held in front -->
    <g transform="translate(232 112)">
      <path d="M0 18 L28 4 L56 18 L28 32 Z" fill="#ffe08a" stroke="#a87b00" stroke-width="2"/>
      <path d="M0 18 L28 32 L28 66 L0 52 Z" fill="#f2b632" stroke="#a87b00" stroke-width="2"/>
      <path d="M56 18 L28 32 L28 66 L56 52 Z" fill="#d99a1a" stroke="#a87b00" stroke-width="2"/>
      <text x="14" y="48" font-family="Courier New, monospace" font-size="11" font-weight="bold" fill="#5a3d00" text-anchor="middle">0x</text>
    </g>
    <path d="M222 120 Q 232 128 240 124" fill="none" stroke="#7a4d2b" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- seven client blocks, each matching, on the ground -->
  <rect x="0" y="420" width="800" height="80" fill="#9ad37a"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
    <g transform="translate(40 360)"><rect width="80" height="60" rx="6" fill="#5b8def"/><text x="40" y="26" fill="#fff">geth</text><text x="40" y="48" fill="#eaffea" font-size="20">✓</text></g>
    <g transform="translate(145 360)"><rect width="80" height="60" rx="6" fill="#e0565b"/><text x="40" y="26" fill="#fff">erigon</text><text x="40" y="48" fill="#eaffea" font-size="20">✓</text></g>
    <g transform="translate(250 360)"><rect width="80" height="60" rx="6" fill="#7b61c9"/><text x="40" y="26" fill="#fff">nethermind</text><text x="40" y="48" fill="#eaffea" font-size="20">✓</text></g>
    <g transform="translate(355 360)"><rect width="80" height="60" rx="6" fill="#e8844a"/><text x="40" y="26" fill="#fff">reth</text><text x="40" y="48" fill="#eaffea" font-size="20">✓</text></g>
    <g transform="translate(460 360)"><rect width="80" height="60" rx="6" fill="#2fa39a"/><text x="40" y="26" fill="#fff">besu</text><text x="40" y="48" fill="#eaffea" font-size="20">✓</text></g>
    <g transform="translate(565 360)"><rect width="80" height="60" rx="6" fill="#3d3d3d"/><text x="40" y="26" fill="#fff">ethrex</text><text x="40" y="48" fill="#eaffea" font-size="20">✓</text></g>
    <g transform="translate(670 360)"><rect width="80" height="60" rx="6" fill="#d9a520"/><text x="40" y="26" fill="#fff">nimbus</text><text x="40" y="48" fill="#eaffea" font-size="20">✓</text></g>
  </g>

  <text x="400" y="475" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2d5a1f" text-anchor="middle">buildtest: seven clients, every block they build matches</text>
</svg>
