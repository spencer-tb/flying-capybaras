<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7b98b"/>
      <stop offset="0.55" stop-color="#fbe1c4"/>
      <stop offset="1" stop-color="#eaf5ff"/>
    </linearGradient>
    <radialGradient id="fur" cx="0.45" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#b07a45"/>
      <stop offset="1" stop-color="#8a5a2e"/>
    </radialGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe9f5"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="110" cy="95" r="44" fill="#ffd36b"/>
  <circle cx="110" cy="95" r="62" fill="#ffd36b" opacity="0.25"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.95">
    <circle cx="560" cy="80" r="24"/><circle cx="590" cy="68" r="30"/>
    <circle cx="622" cy="82" r="22"/><rect x="540" y="80" width="100" height="24" rx="12"/>
    <circle cx="250" cy="420" r="20"/><circle cx="276" cy="410" r="26"/>
    <circle cx="302" cy="422" r="18"/><rect x="232" y="422" width="88" height="18" rx="9"/>
  </g>

  <!-- ground -->
  <ellipse cx="400" cy="520" rx="520" ry="70" fill="#9fd27c"/>

  <!-- mailbox 0x01 -->
  <rect x="655" y="330" width="14" height="140" fill="#6b4a2b"/>
  <rect x="610" y="270" width="104" height="70" rx="30" fill="#3f7fd0"/>
  <rect x="610" y="300" width="104" height="40" fill="#3f7fd0"/>
  <rect x="622" y="296" width="80" height="10" rx="5" fill="#244f88"/>
  <text x="662" y="330" font-family="Menlo, monospace" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">0x01</text>
  <rect x="712" y="248" width="6" height="40" fill="#d94b4b"/>
  <rect x="712" y="248" width="26" height="16" fill="#d94b4b"/>

  <!-- locked contract crate, address withheld -->
  <g transform="translate(470 392)">
    <rect x="0" y="0" width="92" height="72" rx="8" fill="#c99a5e" stroke="#8a6232" stroke-width="4"/>
    <line x1="0" y1="24" x2="92" y2="24" stroke="#8a6232" stroke-width="4"/>
    <line x1="0" y1="48" x2="92" y2="48" stroke="#8a6232" stroke-width="4"/>
    <path d="M34 20 v-12 a12 12 0 0 1 24 0 v12" fill="none" stroke="#5b5b66" stroke-width="6"/>
    <rect x="28" y="20" width="36" height="28" rx="5" fill="#7c7c88"/>
    <circle cx="46" cy="32" r="4" fill="#3a3a44"/>
    <text x="46" y="68" font-family="Menlo, monospace" font-size="13" font-weight="700" fill="#5a3d1c" text-anchor="middle">code</text>
  </g>

  <!-- speed lines -->
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.9">
    <line x1="60" y1="235" x2="160" y2="235"/>
    <line x1="85" y1="268" x2="190" y2="268"/>
    <line x1="70" y1="300" x2="150" y2="300"/>
  </g>

  <!-- capybara -->
  <g transform="translate(205 160) rotate(-6)">
    <!-- back wing -->
    <path d="M150 40 C120 -40 40 -50 20 -20 C60 -10 90 10 120 50 Z" fill="url(#wing)" stroke="#b9cde0" stroke-width="3"/>
    <!-- body -->
    <ellipse cx="160" cy="100" rx="130" ry="72" fill="url(#fur)"/>
    <!-- legs tucked -->
    <ellipse cx="90" cy="160" rx="22" ry="14" fill="#7a4e27"/>
    <ellipse cx="210" cy="164" rx="22" ry="14" fill="#7a4e27"/>
    <!-- head -->
    <ellipse cx="282" cy="78" rx="66" ry="52" fill="url(#fur)"/>
    <rect x="300" y="60" width="62" height="54" rx="26" fill="#8f5f31"/>
    <ellipse cx="350" cy="80" rx="7" ry="5" fill="#3b2412"/>
    <ellipse cx="236" cy="34" rx="14" ry="10" fill="#7a4e27"/>
    <circle cx="282" cy="62" r="7" fill="#2b1a0c"/>
    <circle cx="284" cy="60" r="2.5" fill="#ffffff"/>
    <path d="M330 102 q10 8 22 0" fill="none" stroke="#3b2412" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="262" cy="92" rx="10" ry="6" fill="#e59a8c" opacity="0.6"/>
    <!-- front wing -->
    <path d="M140 70 C110 -30 10 -30 -10 10 C40 20 80 40 110 90 Z" fill="url(#wing)" stroke="#b9cde0" stroke-width="3"/>
    <path d="M30 0 C60 10 85 30 105 60" fill="none" stroke="#c8d8e8" stroke-width="3"/>
    <!-- signed letter in the mouth -->
    <g transform="translate(352 92) rotate(10)">
      <rect x="0" y="0" width="74" height="48" rx="4" fill="#fffaf0" stroke="#c9b48a" stroke-width="3"/>
      <path d="M0 0 L37 26 L74 0" fill="none" stroke="#c9b48a" stroke-width="3"/>
      <circle cx="37" cy="30" r="11" fill="#c0392b"/>
      <text x="37" y="34" font-family="Menlo, monospace" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">v,r,s</text>
    </g>
  </g>

  <!-- sparkles -->
  <g fill="#ffffff">
    <path d="M500 100 l5 12 l12 5 l-12 5 l-5 12 l-5 -12 l-12 -5 l12 -5 z"/>
    <path d="M740 180 l4 9 l9 4 l-9 4 l-4 9 l-4 -9 l-9 -4 l9 -4 z"/>
  </g>
</svg>
