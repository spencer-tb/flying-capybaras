    <g fill="#7c5029">
      <rect x="412" y="380" width="28" height="44" rx="13"/>
      <rect x="456" y="386" width="28" height="44" rx="13"/>
      <rect x="542" y="386" width="28" height="44" rx="13"/>
      <rect x="582" y="378" width="28" height="44" rx="13"/>
    </g>
    <ellipse cx="500" cy="330" rx="148" ry="82" fill="url(#fur)"/>
    <ellipse cx="515" cy="370" rx="104" ry="34" fill="#bf8b55" opacity="0.7"/>
    <path d="M 402 292 q 12 -10 24 0 M 452 272 q 12 -10 24 0 M 384 336 q 12 -10 24 0" stroke="#7c5029" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
    <!-- scarf -->
    <path d="M 594 296 C 550 268 510 286 470 266 C 452 258 436 240 414 236 C 432 256 448 274 470 286 C 510 304 552 312 594 320 Z" fill="#3fb36b"/>
    <!-- head -->
    <rect x="576" y="238" width="140" height="116" rx="48" fill="url(#fur)"/>
    <rect x="664" y="272" width="78" height="78" rx="32" fill="#8d5d30"/>
    <circle cx="616" cy="240" r="17" fill="#7c5029"/>
    <circle cx="616" cy="241" r="8" fill="#55341a"/>
    <rect x="572" y="290" width="26" height="60" rx="10" fill="#3fb36b"/>
    <path d="M 600 258 L 706 248" stroke="#4a4a4a" stroke-width="7" stroke-linecap="round"/>
    <circle cx="640" cy="254" r="15" fill="#a8e6ff" stroke="#4a4a4a" stroke-width="5"/>
    <circle cx="676" cy="250" r="15" fill="#a8e6ff" stroke="#4a4a4a" stroke-width="5"/>
    <circle cx="635" cy="249" r="4" fill="#ffffff"/>
    <circle cx="671" cy="245" r="4" fill="#ffffff"/>
    <ellipse cx="672" cy="286" rx="7" ry="8.5" fill="#1d120a"/>
    <circle cx="674.5" cy="283" r="2.6" fill="#ffffff"/>
    <ellipse cx="734" cy="294" rx="10" ry="7" fill="#3b2614"/>
    <path d="M 710 330 q 11 9 24 0" stroke="#3b2614" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="692" cy="318" rx="13" ry="7.5" fill="#f08c8c" opacity="0.55"/>
    <!-- front wing -->
    <path d="M 495 266 C 455 206 398 164 328 166 C 358 182 362 194 346 206 C 382 208 392 220 376 233 C 412 235 422 247 408 261 C 440 260 466 266 488 282 Z"
          fill="#ffffff" stroke="#c3cfdc" stroke-width="3"/>
    <!-- paw holding the balloon string -->
    <ellipse cx="438" cy="214" rx="13" ry="9" fill="#7c5029"/>
  </g>
</svg>
