<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9c9"/>
      <stop offset="1" stop-color="#fff8ee"/>
    </linearGradient>
    <radialGradient id="fur" cx="0.45" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#b47d48"/>
      <stop offset="1" stop-color="#8a5a2e"/>
    </radialGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e1eaf4"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="90" cy="80" r="40" fill="#ffc35e"/>
  <circle cx="90" cy="80" r="62" fill="#ffc35e" opacity="0.25"/>

  <g fill="#ffffff" opacity="0.95">
    <circle cx="640" cy="80" r="20"/><circle cx="666" cy="70" r="26"/>
    <circle cx="694" cy="82" r="18"/><rect x="624" y="80" width="88" height="20" rx="10"/>
  </g>

  <text x="400" y="40" text-anchor="middle" font-family="Menlo, monospace" font-size="20" font-weight="700" fill="#7a4a12">GASPRICE in the EIP-8141 frame variant</text>

  <!-- the fee stack: base fee + tip -->
  <g font-family="Menlo, monospace" font-weight="700" text-anchor="middle">
    <g transform="translate(90 300)">
      <rect width="200" height="150" rx="14" fill="#fde2e2" stroke="#e5484d" stroke-width="4"/>
      <text x="100" y="34" font-size="16" fill="#7a2a2c">before</text>
      <text x="100" y="66" font-size="14" fill="#7a2a2c">tip = 10 - 0</text>
      <text x="100" y="94" font-size="14" fill="#7a2a2c">GASPRICE = 7 + 10</text>
      <text x="100" y="132" font-size="34" fill="#e5484d">17</text>
    </g>
    <g transform="translate(510 300)">
      <rect width="200" height="150" rx="14" fill="#e3f4e8" stroke="#3f9b5a" stroke-width="4"/>
      <text x="100" y="34" font-size="16" fill="#1f5a32">after</text>
      <text x="100" y="66" font-size="14" fill="#1f5a32">tip = 10 - 7</text>
      <text x="100" y="94" font-size="14" fill="#1f5a32">GASPRICE = 7 + 3</text>
      <text x="100" y="132" font-size="34" fill="#3f9b5a">10</text>
    </g>
    <path d="M305 375 L 495 375" stroke="#7a4a12" stroke-width="5" stroke-linecap="round"/>
    <path d="M480 362 L 498 375 L 480 388 Z" fill="#7a4a12"/>
  </g>

  <!-- flying capybara carrying a base fee coin -->
  <g transform="translate(250 90)">
    <path d="M70 40 C 20 -40, -50 -20, -40 30 C 0 20, 30 30, 70 50 Z" fill="url(#wing)" stroke="#b9c7d6" stroke-width="3"/>
    <path d="M150 40 C 200 -40, 270 -20, 260 30 C 220 20, 190 30, 150 50 Z" fill="url(#wing)" stroke="#b9c7d6" stroke-width="3"/>
    <ellipse cx="110" cy="80" rx="95" ry="58" fill="url(#fur)"/>
    <ellipse cx="205" cy="62" rx="48" ry="40" fill="url(#fur)"/>
    <rect x="222" y="48" width="34" height="34" rx="14" fill="#7a4f28"/>
    <circle cx="198" cy="48" r="6" fill="#2b1a0e"/>
    <circle cx="200" cy="46" r="2" fill="#ffffff"/>
    <ellipse cx="176" cy="30" rx="9" ry="7" fill="#7a4f28"/>
    <circle cx="246" cy="60" r="3" fill="#2b1a0e"/>
    <path d="M232 76 q 8 6 16 0" stroke="#2b1a0e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <rect x="50" y="122" width="18" height="26" rx="8" fill="#7a4f28"/>
    <rect x="150" y="122" width="18" height="26" rx="8" fill="#7a4f28"/>
    <!-- coin held below -->
    <line x1="160" y1="140" x2="160" y2="168" stroke="#8b5e34" stroke-width="4"/>
    <circle cx="160" cy="188" r="22" fill="#f8d96a" stroke="#b8891a" stroke-width="3"/>
    <text x="160" y="194" text-anchor="middle" font-family="Menlo, monospace" font-size="16" font-weight="700" fill="#7a5a10">7</text>
    <text x="110" y="88" text-anchor="middle" font-family="Menlo, monospace" font-size="15" font-weight="700" fill="#fff4e0">base fee</text>
  </g>
</svg>
