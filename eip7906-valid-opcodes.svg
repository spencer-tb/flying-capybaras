<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9ecff"/>
      <stop offset="1" stop-color="#f5faff"/>
    </linearGradient>
    <radialGradient id="fur" cx="0.45" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#b47d48"/>
      <stop offset="1" stop-color="#8a5a2e"/>
    </radialGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e1eaf4"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="705" cy="78" r="38" fill="#ffd36e"/>
  <circle cx="705" cy="78" r="58" fill="#ffd36e" opacity="0.25"/>
  <g fill="#ffffff" opacity="0.95">
    <circle cx="100" cy="86" r="20"/><circle cx="126" cy="76" r="26"/>
    <circle cx="154" cy="88" r="18"/><rect x="84" y="86" width="88" height="20" rx="10"/>
  </g>

  <text x="400" y="40" text-anchor="middle" font-family="Menlo, monospace" font-size="20" font-weight="700" fill="#2c4d7c">EIP-7906 opcodes join valid_opcodes</text>

  <!-- clipboard checklist -->
  <g transform="translate(470 150)" font-family="Menlo, monospace" font-weight="700">
    <rect width="250" height="290" rx="16" fill="#fffdf6" stroke="#8a6a3a" stroke-width="4"/>
    <rect x="85" y="-14" width="80" height="28" rx="8" fill="#8a6a3a"/>
    <text x="125" y="44" text-anchor="middle" font-size="16" fill="#5a4320">valid_opcodes</text>
    <g font-size="14" fill="#2b3a55">
      <text x="56" y="92">APPROVE</text>
      <text x="56" y="124">TXPARAM</text>
      <text x="56" y="156">SIGDATACOPY</text>
      <text x="56" y="196" fill="#1f6a3a">TXTRACE 0xB6</text>
      <text x="56" y="236" fill="#1f6a3a">EVENTDATACOPY</text>
      <text x="56" y="254" font-size="12" fill="#1f6a3a">0xB7</text>
    </g>
    <g stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M26 86 l8 8 l14 -16" stroke="#8aa0c0"/>
      <path d="M26 118 l8 8 l14 -16" stroke="#8aa0c0"/>
      <path d="M26 150 l8 8 l14 -16" stroke="#8aa0c0"/>
      <path d="M26 190 l8 8 l14 -16" stroke="#3f9b5a"/>
      <path d="M26 230 l8 8 l14 -16" stroke="#3f9b5a"/>
    </g>
  </g>

  <!-- flying capybara with a pencil -->
  <g transform="translate(110 150)">
    <path d="M70 40 C 20 -40, -50 -20, -40 30 C 0 20, 30 30, 70 50 Z" fill="url(#wing)" stroke="#b9c7d6" stroke-width="3"/>
    <path d="M150 40 C 200 -40, 270 -20, 260 30 C 220 20, 190 30, 150 50 Z" fill="url(#wing)" stroke="#b9c7d6" stroke-width="3"/>
    <ellipse cx="110" cy="80" rx="95" ry="58" fill="url(#fur)"/>
    <ellipse cx="205" cy="62" rx="48" ry="40" fill="url(#fur)"/>
    <rect x="222" y="48" width="34" height="34" rx="14" fill="#7a4f28"/>
    <circle cx="198" cy="48" r="6" fill="#2b1a0e"/>
    <circle cx="200" cy="46" r="2" fill="#ffffff"/>
    <ellipse cx="176" cy="30" rx="9" ry="7" fill="#7a4f28"/>
    <circle cx="246" cy="60" r="3" fill="#2b1a0e"/>
    <path d="M232 76 q 8 6 16 0" stroke="#2b1a0e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <rect x="50" y="122" width="18" height="26" rx="8" fill="#7a4f28"/>
    <rect x="150" y="122" width="18" height="26" rx="8" fill="#7a4f28"/>
    <!-- pencil -->
    <line x1="240" y1="110" x2="330" y2="180" stroke="#e0a63a" stroke-width="10" stroke-linecap="round"/>
    <path d="M326 174 L 346 192 L 334 182 Z" fill="#2b1a0e"/>
    <text x="110" y="88" text-anchor="middle" font-family="Menlo, monospace" font-size="15" font-weight="700" fill="#fff4e0">ASSERT</text>
  </g>
</svg>
